# ─── Friendboxd — local Docker Compose ──────────────────────────────────
# Usage:
#   docker compose up --build        # build + run on http://localhost:3000
#   docker compose up --build -d     # detached
#
# The full image (with the stealth-browser crawl fallback) is the default.
# For the lightweight HTTP-only image, uncomment the build.args line below
# and set CRAWLER_MODE to http.

services:
  friendboxd:
    build:
      context: .
      # args:
      #   INSTALL_BROWSER: 0   # lightweight HTTP-only image (~290 MB)
    image: friendboxd
    container_name: friendboxd
    ports:
      - '3000:3000'
    environment:
      # ── AI layer (optional) ──────────────────────────────────────────
      # OPENAI_API_KEY: sk-...
      # OPENAI_BASE_URL: https://api.openai.com/v1
      # OPENAI_MODEL: gpt-4o-mini
      # ── Crawler ──────────────────────────────────────────────────────
      # auto (default, stealth browser) | http (lightweight) | browser
      CRAWLER_MODE: auto
      # Rate limit: max requests per sliding window (default 2 per 10s).
      # CRAWLER_RATE_MAX: 2
      # CRAWLER_RATE_WINDOW_MS: 10000
      # ── Proxy pool (optional) ────────────────────────────────────────
      # PROXY_POOL: http://user:pass@host:port,http://host2:port
      # PROXY_MAX_TRIES: 3
    restart: unless-stopped