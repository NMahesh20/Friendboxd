# ─── Build & push both Docker images to Docker Hub ──────────────────────
# Builds the full image (default — with the Playwright Chromium stealth
# fallback) and the lightweight image (HTTP-only crawling), then pushes
# both to Docker Hub.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  — Docker Hub username
#   DOCKERHUB_TOKEN     — Docker Hub access token (read/write)
#
# Triggers:
#   - push to main            → latest, full, light
#   - push a v* tag           → latest, full, light + <version>, <version>-light
#   - manual (workflow_dispatch)

name: Build & Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/friendboxd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          BASE="${{ env.IMAGE }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
            echo "full=$BASE:latest,$BASE:full,$BASE:$VER" >> "$GITHUB_OUTPUT"
            echo "light=$BASE:light,$BASE:$VER-light" >> "$GITHUB_OUTPUT"
          else
            echo "full=$BASE:latest,$BASE:full" >> "$GITHUB_OUTPUT"
            echo "light=$BASE:light" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push full image (default, with browser)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.full }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push lightweight image (HTTP-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: INSTALL_BROWSER=0
          tags: ${{ steps.tags.outputs.light }}
          cache-from: type=gha
          cache-to: type=gha,mode=max