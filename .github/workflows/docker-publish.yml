# ─── Build & push both Docker images to Docker Hub ──────────────────────
# Builds the full image (default — with the Playwright Chromium stealth
# fallback) and the lightweight image (HTTP-only crawling), then pushes
# both to Docker Hub.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  — Docker Hub username
#   DOCKERHUB_TOKEN     — Docker Hub access token (read/write)
#
# Triggers:
#   - push a version tag      → latest, full, light + <version>, <version>-light
#     (matches both "v0.1.0" and plain "0.1.0")
#   - manual (workflow_dispatch)

name: Build & Push Docker Images

# Show the release version in the run name (e.g. "Build & Push Docker Images (0.1.0)").
run-name: ${{ github.ref_type == 'tag' && format('Build & Push Docker Images ({0})', github.ref_name) }}

on:
  push:
    # branches: [main]
    # Match plain "0.1.0" release tags.
    tags: ['[0-9]*']
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/friendboxd
  # Shared OCI labels applied to both images via docker/metadata-action.
  IMAGE_TITLE: Friendboxd
  IMAGE_DESCRIPTION: Movie picks from your friends' Letterboxd watchlists — taste-matched, genre-filtered recommendations with an optional AI layer.
  IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
  IMAGE_ICON: https://raw.githubusercontent.com/NMahesh20/Friendboxd/refs/heads/main/images/icon.png

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (full image)
        id: meta-full
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=full
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
            org.opencontainers.image.url=${{ env.IMAGE_SOURCE }}
            my.custom.namespace.icon=${{ env.IMAGE_ICON }}

      - name: Docker metadata (light image)
        id: meta-light
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=light
            type=semver,pattern={{version}},suffix=-light
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
            org.opencontainers.image.url=${{ env.IMAGE_SOURCE }}
            my.custom.namespace.icon=${{ env.IMAGE_ICON }}

      - name: Build & push full image (default, with browser)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push lightweight image (HTTP-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: INSTALL_BROWSER=0
          tags: ${{ steps.meta-light.outputs.tags }}
          labels: ${{ steps.meta-light.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max